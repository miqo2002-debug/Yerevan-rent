<!DOCTYPE html>

<html lang="hy">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yerevan Rent</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}

header{background:#172b4d;color:white;padding:25px 6%;display:flex;justify-content:space-between;align-items:center}

header h1{margin:0;font-size:24px}

header span{color:#b8c9e5;font-size:13px}

main{max-width:1000px;margin:30px auto;padding:0 16px}

h2{margin-top:0}

.form,.listing{background:white;padding:22px;border-radius:14px;margin-bottom:22px;box-shadow:0 3px 15px #0000000c}

input,textarea,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}

textarea{min-height:90px}

button{background:#1769e0;color:white;border:0;padding:13px 20px;border-radius:8px;font-size:15px;cursor:pointer}

button:hover{background:#1054b8}

.listing img{width:100%;max-height:260px;object-fit:cover;border-radius:10px}

.price{font-size:21px;font-weight:bold;color:#1769e0}

.small{color:#777;font-size:13px}

footer{text-align:center;padding:25px;color:#777}

</style>

</head>

<body>

<header>

<div>

<h1>YEREVAN RENT</h1>

<span>Բնակարանների և տների վարձակալություն</span>

</div>

</header>

<main>

<section class="form">

<h2>Ավելացնել հայտարարություն</h2>

<form id="rentForm">

<label>Հայտարարության վերնագիր</label>

<input id="title" placeholder="Օրինակ՝ 2 սենյականոց բնակարան Կենտրոնում" required>

<label>Հասցե / Թաղամաս</label>

<input id="location" placeholder="Օրինակ՝ Կենտրոն, Աբովյան փողոց" required>

<label>Գին (դրամ)</label>

<input id="price" type="number" placeholder="300000" required>

<label>Մակերես (քմ)</label>

<input id="area" type="number" placeholder="65">

<label>Սենյակների քանակ</label>

<input id="rooms" type="number" placeholder="2">

<label>Նկարագրություն</label>

<textarea id="description" placeholder="Նկարագրեք բնակարանը..."></textarea>

<label>Լուսանկար</label>

<input id="photo" type="url" placeholder="Նկարի հղումը (URL)">

<button type="submit">Ավելացնել հայտարարությունը</button>

</form>

</section>

<h2>Վերջին հայտարարությունները</h2>

<div id="listings"></div>

</main>

<footer>Yerevan Rent © 2026</footer>

<script>

const form=document.getElementById('rentForm');

const listings=document.getElementById('listings');

form.addEventListener('submit',function(e){

e.preventDefault();

const title=document.getElementById('title').value;

const location=document.getElementById('location').value;

const price=document.getElementById('price').value;

const area=document.getElementById('area').value;

const rooms=document.getElementById('rooms').value;

const description=document.getElementById('description').value;

const photo=document.getElementById('photo').value;

const card=document.createElement('div');

card.className='listing';

if(photo){

const img=document.createElement('img');

img.src=photo;

img.alt=title;

card.appendChild(img);

}

const heading=document.createElement('h3');

heading.textContent=title;

card.appendChild(heading);

const place=document.createElement('p');

place.textContent='📍 '+location;

card.appendChild(place);

const cost=document.createElement('p');

cost.className='price';

cost.textContent=Number(price).toLocaleString('hy-AM')+' ֏ / ամիս';

card.appendChild(cost);

const details=document.createElement('p');

details.textContent=(area?area+' քմ':'')+(rooms?' · '+rooms+' սենյակ':'');

card.appendChild(details);

const desc=document.createElement('p');

desc.textContent=description;

card.appendChild(desc);

listings.prepend(card);

form.reset();

});

</script>

</body>

</html>
